name: Windows verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    # Windows runner TEMP may use an 8.3 alias (RUNNER~1). Use an ordinary
    # canonical runner directory so path guards are tested without aliases.
    env:
      TEMP: ${{ runner.temp }}
      TMP: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:setup
      - run: npm run test:session-resilience
      - run: npm run test:tunnel
      - run: npm run check:release
