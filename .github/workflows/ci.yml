name: Windows verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # Set this on the runner: the runner context is unavailable in job env.
      # Keep strict path checks; avoid the default Windows 8.3 TEMP alias.
      - name: Use canonical temporary directory
        run: |
          $testTempDir = (node -e "console.log(require('fs').realpathSync(process.env.RUNNER_TEMP))").Trim()
          "TEMP=$testTempDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$testTempDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:setup
      - run: npm run test:session-resilience
      - run: npm run test:tunnel
      - run: npm run check:release
