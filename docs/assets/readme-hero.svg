<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="260" viewBox="0 0 1100 260" role="img" aria-labelledby="title desc">
  <title id="title">From the browser to your workstation</title>
  <desc id="desc">Guichen Local Coder connects browser AI to workspace files, verified binary uploads, and Shell Guard. Shell uses the current account's permissions.</desc>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .surface { fill: #f6f7f9; stroke: #e3e7ed; }
    .primary { fill: #18212f; }
    .secondary { fill: #697586; }
    .accent { fill: #2563eb; }
    .tile { fill: #e8efff; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #161b22; stroke: #30363d; }
      .primary { fill: #e6edf3; }
      .secondary { fill: #9aa7b8; }
      .accent { fill: #83adff; }
      .tile { fill: #1e3052; }
    }
  </style>
  <rect class="surface" x="0.5" y="0.5" width="1099" height="259" rx="18"/>
  <rect class="tile" x="36" y="30" width="34" height="34" rx="9"/>
  <path d="m45 41 5 6-5 6m10 0h7" fill="none" stroke="#2563eb" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="accent" x="82" y="52" font-size="12" font-weight="700" letter-spacing="1.8">BROWSER → LOCAL MCP</text>
  <text class="primary" x="36" y="114" font-size="39" font-weight="650">From the browser</text>
  <text class="primary" x="36" y="160" font-size="39" font-weight="650">to your workstation.</text>
  <text class="secondary" x="38" y="209" font-size="14">Research files. Verified transfers. Explicit execution policy.</text>
  <rect x="598" y="30" width="466" height="200" rx="14" fill="#1b2332"/>
  <path d="M616 72h430" stroke="#354052"/>
  <path d="m623 43 7-3 7 3v7c0 6-7 10-7 10s-7-4-7-10z" fill="none" stroke="#83adff" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="649" y="54" fill="#cad5e5" font-size="12" font-weight="600" letter-spacing="1.5">GUICHEN LOCAL CODER</text>
  <g font-size="13">
    <text x="624" y="100" fill="#a9b9cf">Workspace files</text>
    <text x="819" y="100" fill="#c8f4d8">All ordinary descendants</text>
    <text x="624" y="134" fill="#a9b9cf">Binary uploads</text>
    <text x="819" y="134" fill="#c8f4d8">SHA-256 checked</text>
    <text x="624" y="168" fill="#a9b9cf">Shell Guard</text>
    <text x="819" y="168" fill="#c8f4d8">Approval / Trusted</text>
  </g>
  <path d="M616 187h430" stroke="#354052"/>
  <circle cx="629" cy="209" r="3" fill="#efbd73"/>
  <text x="642" y="213" fill="#a9b9cf" font-size="11">Shell runs with your Windows account's permissions.</text>
</svg>
